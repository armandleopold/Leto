name: CI

# Pull requests and `main` only, so a branch with an open pull request does not
# run everything twice. Changes to documentation alone run nothing.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format, lints, tests, the compile check for every target, and the web
  # client. One job so they share a single build cache.
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Sound output on Linux goes through ALSA and gamepads through udev,
      # and building against them needs their headers. The camera goes
      # through V4L2, whose bindings are made with libclang.
      - name: Install the ALSA and udev headers, and libclang
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libudev-dev libclang-dev
      # The macOS compile check has C and C++ code to build, and zig is a
      # compiler for macOS that runs on Linux.
      - name: Install zig
        run: pipx install ziglang==0.17.1
      - name: Format, lints, tests, targets
        run: cargo xtask ci
      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the web client
        run: cargo xtask web

  # Windows is the first host platform and one of the three tested by hand.
  # This job is also the only check of the Windows build.
  windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo xtask test

  # macOS runners are the most expensive, so real tests there run on `main`
  # and on demand. Pull requests still compile-check macOS from Linux.
  macos:
    name: Tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # macOS has one local address, 127.0.0.1. A test with both ends of a
      # WireGuard tunnel on one machine needs another for the tunnel's door.
      - name: Add local addresses for the doors of a tunnel
        run: for n in 1 2 3 4; do sudo ifconfig lo0 alias 127.77.0.$n; done
      - name: Tests
        run: cargo xtask test

  dependencies:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
