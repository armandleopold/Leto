name: Release builds

# Builds Leto for every platform there is a build for and attaches the
# builds, the matching source code and their checksums to the GitHub release
# of a tag, then publishes the site, which serves the files of the latest
# release for download.
#
# The Release Please workflow calls this one after it has published a
# release. It can also be started by hand from the Actions tab with a tag:
# the tag is made from main when it does not exist yet, and the release is
# created when there is none.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag of the release, for example v0.1.0"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release, for example v0.1.0"
        type: string
        required: true

concurrency:
  group: release-builds
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  # The tag has to say the version the crates carry, or the files would be
  # named after one version and report another.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Compare the tag with the workspace version, and make the tag if needed
        run: |
          exists=false
          if git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            exists=true
            git checkout --quiet "refs/tags/$TAG"
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but Cargo.toml says version $version."
            exit 1
          fi
          if [ "$exists" = false ]; then
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  web:
    name: Web client
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the web client
        run: cargo xtask web
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/web
          if-no-files-found: error

  # Each archive holds the app, the command line and the web client in
  # dist/web, where `leto-cli bridge` looks for it when started from the
  # unpacked folder.
  desktop:
    name: Build (${{ matrix.name }})
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows-x86_64
            exe: .exe
          # The oldest supported Ubuntu runner, so the build runs on as many
          # distributions as it can (glibc is only ever compatible upwards).
          - name: Linux
            os: ubuntu-22.04
            platform: linux-x86_64
            exe: ""
          - name: macOS
            os: macos-latest
            platform: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    # SignPath fetches the unsigned Windows files from this run's artifacts.
    permissions:
      contents: read
      actions: read
    env:
      ARCHIVE: leto-${{ needs.version.outputs.version }}-${{ matrix.platform }}
      # Signing is skipped where its secrets are not set. docs/signing.md
      # says how to get each of them.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # NASM gives the H.264 codec its fast routines. Without it decoding is
      # several times slower, which a release should not be.
      - name: Install NASM and the Linux headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes nasm libasound2-dev libudev-dev libclang-dev
      - name: Install NASM
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"
      - name: Build
        run: cargo build --locked --release --package leto --package leto-cli
      # Windows: SignPath signs leto.exe and leto-cli.exe with Authenticode,
      # with a certificate of the SignPath Foundation, once a maintainer has
      # approved the request on signpath.io. The job waits for it.
      - name: Hand the Windows files to SignPath
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: |
            target/release/leto.exe
            target/release/leto-cli.exe
          if-no-files-found: error
      - name: Sign them (approve the request on signpath.io)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'leto' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A day, so the request can wait for its approval.
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed
      - name: Use the signed files
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signed\leto.exe, signed\leto-cli.exe target\release\ -Force
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in "target\release\leto.exe", "target\release\leto-cli.exe") {
            $signature = Get-AuthenticodeSignature $file
            Write-Output "$file`: $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($env:SIGNPATH_API_TOKEN -and $signature.Status -ne 'Valid') {
              Write-Output "::error::$file is not signed."
              exit 1
            }
          }
          if (-not $env:SIGNPATH_API_TOKEN) {
            Write-Output "::warning::No SIGNPATH_API_TOKEN secret: the Windows files are not signed."
          }
      # macOS: signed with a Developer ID certificate and the hardened
      # runtime, then notarized by Apple. Bare programs cannot carry the
      # notarization ticket, so Gatekeeper asks Apple on the first start.
      - name: Sign and notarize the macOS files
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/leto.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate in APPLE_CERTIFICATE_P12_BASE64 is not a Developer ID Application one."
            exit 1
          fi
          for file in target/release/leto target/release/leto-cli; do
            codesign --force --options runtime --timestamp \
              --entitlements .github/release/macos.entitlements \
              --sign "$identity" "$file"
            codesign --verify --strict --verbose=2 "$file"
          done
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          zip -qj "$RUNNER_TEMP/notarize.zip" target/release/leto target/release/leto-cli
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm "$RUNNER_TEMP/notary.p8"
          if ! grep -q '"status":"Accepted"' "$RUNNER_TEMP/notary.json"; then
            id=$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::error::Apple did not notarize the macOS files."
            exit 1
          fi
      - name: No macOS signature
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::No APPLE_CERTIFICATE_P12_BASE64 secret: the macOS files are only signed ad hoc."
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ env.ARCHIVE }}/dist/web
      - name: Gather the files
        shell: bash
        run: |
          cp "target/release/leto${{ matrix.exe }}" "target/release/leto-cli${{ matrix.exe }}" "$ARCHIVE/"
          cp LICENSE "$ARCHIVE/LICENSE.txt"
          cp .github/release/README.txt "$ARCHIVE/"
      - name: Pack (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path $env:ARCHIVE -DestinationPath "$env:ARCHIVE.zip"
      - name: Pack (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  # A phone only installs an update signed with the same key as the version
  # it has. With the ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD secrets
  # every release is signed with that one key; without them each release
  # gets a key of its own, and a phone has to uninstall Leto to update it.
  android:
    name: Build (Android)
    needs: version
    runs-on: ubuntu-latest
    # The OIDC token lets the job sign in to Infisical without a secret.
    permissions:
      contents: read
      id-token: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libudev-dev libclang-dev
      # The key can live in Infisical instead of GitHub's secrets: its
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD and ANDROID_CERT_SHA256
      # become environment variables of the next steps. docs/signing.md
      # says which variables point the job at it.
      - name: Fetch the release key from Infisical (OIDC)
        if: vars.INFISICAL_IDENTITY_ID != ''
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'prod' }}
      - name: Fetch the release key from Infisical (client secret)
        if: vars.INFISICAL_IDENTITY_ID == '' && env.INFISICAL_CLIENT_ID != ''
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'prod' }}
      - name: Use the release key, when there is one
        run: |
          keystore="${ANDROID_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          password="${ANDROID_KEY_PASSWORD:-$KEY_PASSWORD}"
          expected="${ANDROID_CERT_SHA256:-$EXPECTED_CERT}"
          echo "EXPECTED_CERT=$expected" >> "$GITHUB_ENV"
          if [ -z "$keystore" ]; then
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$keystore" | base64 --decode > "$RUNNER_TEMP/leto.keystore"
          echo "::add-mask::$password"
          echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          echo "LETO_ANDROID_KEYSTORE=$RUNNER_TEMP/leto.keystore" >> "$GITHUB_ENV"
          echo "LETO_ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build the APK
        run: cargo xtask android
      # The SHA-256 of the certificate is what a phone compares between two
      # versions. With ANDROID_CERT_SHA256 set (variable or Infisical), a release whose
      # APK is signed with another key fails here instead of reaching phones.
      - name: Check the APK's signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --verbose --print-certs dist/android/leto.apk | tee "$RUNNER_TEMP/certs.txt"
          # "Signer #1 certificate …" or "V3.0 Signer: certificate …",
          # depending on the schemes the APK is signed with.
          actual=$(grep -m 1 'certificate SHA-256 digest: ' "$RUNNER_TEMP/certs.txt" | sed 's/.*digest: //')
          if [ "$HAS_RELEASE_KEY" != true ]; then
            echo "::warning::No release key, in GitHub's secrets or Infisical: this APK has a key of its own, and phones cannot update to it."
          fi
          expected=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed with $actual, not the release key $expected."
            exit 1
          fi
      - name: Name it after the version
        run: cp dist/android/leto.apk "leto-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: leto-*-android.apk
          if-no-files-found: error

  release:
    name: Attach the files to the release
    needs: [version, web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the attestations, which need no secret.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Gather the files
        run: |
          mkdir out
          cp artifacts/windows-x86_64/* artifacts/linux-x86_64/* artifacts/macos-arm64/* artifacts/android/* out/
          (cd artifacts/web && zip -qr "../../out/leto-$VERSION-web.zip" .)
          # Leto is GPL-3.0 and includes GPL code of other projects, so
          # whoever gets a build is offered the source it was built from.
          git archive --format=tar.gz --prefix="leto-$VERSION/" -o "out/leto-$VERSION-source.tar.gz" HEAD
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out
      # Every file gets a signed statement, kept by GitHub, that it was built
      # by this workflow from this tag: `gh attestation verify <file>
      # --repo armandleopold/leto` checks it, on any system.
      - name: Attest where the files come from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*
      # Release Please has already written the release and its notes. Made
      # by hand, the release gets notes from the merged pull requests.
      - name: Attach them
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Leto $VERSION" --generate-notes --verify-tag
          fi

  # A release made with the workflow's own token starts no other workflow,
  # and the github-pages environment only takes deployments from main, not
  # from a tag. So the site is published by starting its workflow on main.
  site:
    name: Publish the site
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the Pages workflow on main
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
