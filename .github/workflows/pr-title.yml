name: Pull request title

# Pull requests are squashed into main with their title as the commit
# message, and Release Please reads those messages to choose the next
# version and write the release notes. So the title follows Conventional
# Commits: `feat: …` for something new, `fix: …` for a fix, `feat!: …` for
# a change that breaks something.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^.+$
