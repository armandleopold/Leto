# Rules for third-party crates, enforced with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Only look at what Leto ships: the targets it supports.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "aarch64-apple-ios",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
# Add an advisory id here only with a comment saying why.
ignore = [
    # Timing side channel in `rsa` 0.9 ("Marvin attack"), fixed in 0.10.
    # moonlight-common-rust still asks for 0.9. Recovering a key takes many
    # timed private-key operations, and Leto does one per pairing, which a
    # person starts by hand: it signs once with this device's key. Creating
    # the key happens offline, and every TLS handshake is signed by `ring`,
    # not by this crate. Remove this line when moonlight-common-rust moves to
    # `rsa` 0.10.
    { id = "RUSTSEC-2023-0071", reason = "one signature per manual pairing; see the comment above" },
]

[licenses]
version = 2
# Licences that may be combined with Leto's GPL-3.0-only code.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    # moonlight-common-rust, the client protocol core.
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    # File-level copyleft, compatible with the GPL. Used by `directories`.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Fonts bundled with egui's default font set.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
# Two versions of one crate is common in a UI stack. Report it, do not fail.
multiple-versions = "warn"
wildcards = "deny"
# Crates inside this workspace depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies must be listed here one by one.
allow-git = [
    # The client protocol core. Not on crates.io, pinned to a commit in the
    # workspace Cargo.toml.
    "https://github.com/MrCreativ3001/moonlight-common-rust.git",
]
