[package]
name = "leto-android"
description = "The Leto app on Android: the same app as on the desktop, in a NativeActivity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Android loads the app as `libleto_android.so`, named in
# `android/AndroidManifest.xml`. The rlib lets the workspace build and test
# this crate on any machine, where it is empty.
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
leto = { path = "../leto" }
# Calls into Android's Java side: the Wi-Fi lock that lets PCs be found.
jni = "0.21"
