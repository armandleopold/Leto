[package]
name = "leto"
description = "The Leto app: host and client in one window, on desktop and in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
leto-core = { workspace = true }
leto-protocol = { workspace = true }
# Every key for a stream, and what the screen is like. Nothing in a browser.
leto-system = { workspace = true }
log = { workspace = true }
# The handle of Leto's window, for the pane pictures go straight to. The
# version eframe uses.
raw-window-handle = "0.6"
# The settings are kept as JSON.
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The client engine needs sockets, which a browser page does not have.
leto-client = { workspace = true }
# Decoders and speakers. The web build will use the browser's own.
leto-media = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# A stand-in PC to stream from in tests.
leto-testhost = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
# Gamepads. On Linux it needs the udev headers (`libudev-dev`) to build.
# Android has none: its gamepads come with the window's input events.
gilrs = { version = "0.11", default-features = false, features = ["wgi"] }
# Reads what to paste into the app's text fields. The version eframe uses.
# Android has no clipboard it can reach without Java.
arboard = { version = "3.6", default-features = false }
# This PC as a host: for now, the companion beside Apollo.
leto-host = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The icon beside the clock while this PC is shared.
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
# The window is an Android NativeActivity, with no Java of Leto's own.
eframe = { workspace = true, features = ["android-native-activity"] }
# The activity's type, for `run_android`. The version eframe uses.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BinaryType",
    "CanvasRenderingContext2d",
    "ChannelCountMode",
    "Document",
    "Element",
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "MessagePort",
    "MouseEvent",
    "Navigator",
    "Node",
    "Performance",
    "Screen",
    "Storage",
    "WebSocket",
    "Window",
    "Worklet",
] }

[build-dependencies]
embed-resource = "3"
