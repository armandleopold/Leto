[package]
name = "leto"
description = "The Leto app: host and client in one window, on desktop and in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
leto-core = { workspace = true }
leto-protocol = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The client engine needs sockets, which a browser page does not have.
leto-client = { workspace = true }
# Decoders and speakers. The web build will use the browser's own.
leto-media = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Reads what to paste into the app's text fields. The version eframe uses.
arboard = { version = "3.6", default-features = false }
# Gamepads. On Linux it needs the udev headers (`libudev-dev`) to build.
gilrs = { version = "0.11", default-features = false, features = ["wgi"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# A stand-in PC to stream from in tests.
leto-testhost = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# What the page and its bridge say to each other is JSON.
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "BinaryType",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "Performance",
    "Storage",
    "WebSocket",
    "Window",
] }
