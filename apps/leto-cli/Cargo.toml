[package]
name = "leto-cli"
description = "Command-line interface to the Leto engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
leto-bridge = { workspace = true }
leto-client = { workspace = true }
leto-core = { workspace = true }
# `companion`: Leto on the PC that is shared, with no window.
leto-host = { workspace = true }
# `companion --save` writes what a camera sees as a PNG, to look at.
image = { workspace = true }
# `play` decodes what it receives, to tell whether Leto can show it.
leto-media = { workspace = true }
leto-protocol = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
leto-testhost = { workspace = true }

[build-dependencies]
embed-resource = "3"
