[package]
name = "leto-tunnel"
description = "A WireGuard tunnel inside Leto, for its own connections to a PC: no administrator rights, no other app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Keys in WireGuard files are written in base64.
base64 = "0.22"
# WireGuard itself, as a library that only turns packets into packets: the
# sockets and threads are Leto's. Cloudflare's, BSD-3-Clause.
boringtun = { version = "0.7", default-features = false }
log = { workspace = true }
# TCP inside the tunnel, which no system call can open there.
smoltcp = { version = "0.14", default-features = false, features = [
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    # Starts slowly and backs off on loss, instead of sending a whole
    # window at once into a socket that may not hold it.
    "socket-tcp-reno",
    "std",
] }
# A receive buffer large enough for a burst of pictures.
socket2 = "0.6"
thiserror = "2"
