[package]
name = "leto-media"
description = "Video and audio for Leto: decoders for what a host sends, the speakers, the microphone and the camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sound output on every desktop system.
cpal = "0.18"
# Cameras that compress their pictures send them as JPEG.
image = { workspace = true, features = ["jpeg"] }
log = { workspace = true }
openh264 = { workspace = true }
# Opus in plain Rust: nothing to install, nothing unsafe. One crate decodes
# what a PC sends, the other encodes the microphone for it.
opus-decoder = "0.1"
opus-rs = "0.1"
thiserror = "2"

# Cameras, through what each system has for them. Nothing is decoded by this
# crate: Leto reads the pictures itself.
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

# On Linux it needs libclang to build (`libclang-dev`).
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }
