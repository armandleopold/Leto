[package]
name = "leto-media"
description = "Video and audio for Leto: decoders for what a host sends, the speakers, the microphone and the camera."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sound output on every desktop system.
cpal = "0.18"
# Cameras that compress their pictures send them as JPEG.
image = { workspace = true, features = ["jpeg"] }
# Draws pictures on the graphics card, with the context the app's window
# draws with: the version eframe uses.
glow = "0.17"
# How a camera is sent to a PC is a rule every client follows.
leto-core = { workspace = true }
log = { workspace = true }
openh264 = { workspace = true }
# Opus in plain Rust: nothing to install, nothing unsafe. One crate decodes
# what a PC sends, the other encodes the microphone for it.
opus-decoder = "0.1"
opus-rs = "0.1"
thiserror = "2"

# Cameras, through what each system has for them. Nothing is decoded by this
# crate: Leto reads the pictures itself.
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
# Pictures decoded by Windows itself, on the graphics card when it can: Media
# Foundation's decoders, given a Direct3D 11 device.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # The program that draws pictures straight on the screen is made for the
    # card by Windows' own compiler.
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # Pictures that stay on the card are shared with the window's OpenGL.
    "Win32_Graphics_OpenGL",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # How large the pane is that pictures are drawn straight on.
    "Win32_UI_WindowsAndMessaging",
] }

# On Linux it needs libclang to build (`libclang-dev`).
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "android")'.dependencies]
# The phone's cameras, read through the NDK.
leto-system = { workspace = true }
