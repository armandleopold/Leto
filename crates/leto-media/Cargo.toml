[package]
name = "leto-media"
description = "Video and audio for Leto: decoders for what a host sends, the speakers, and the microphone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sound output on every desktop system.
cpal = "0.18"
log = { workspace = true }
openh264 = { workspace = true }
# Opus in plain Rust: nothing to install, nothing unsafe. One crate decodes
# what a PC sends, the other encodes the microphone for it.
opus-decoder = "0.1"
opus-rs = "0.1"
thiserror = "2"
