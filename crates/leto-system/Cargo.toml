[package]
name = "leto-system"
description = "What Leto asks of the system itself: every key for a stream, and what a screen is like."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Keys are named the way a PC understands them.
leto-core = { workspace = true }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The clipboard is Java's: reached through JNI, in the Java VM that
# android-activity hands ndk-context.
jni = "0.21"
ndk-context = "0.1"
# The phone's cameras are read through the NDK's Camera2, into pictures
# from its image reader.
ndk-sys = { version = "0.6", features = ["media"] }
# The name of a video decoder, looked for so that Android 8 still starts.
libc = "0.2"
# The window's input events, where gamepads are told of. The version winit
# uses, which hands them over.
android-activity = { version = "0.6", features = ["native-activity"] }
