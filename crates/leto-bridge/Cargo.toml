[package]
name = "leto-bridge"
description = "The bridge between browsers and PCs: serves the web client and runs the client engine for it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# What this computer calls itself, to tell browsers which bridge they reached.
gethostname = "1"
httparse = "1"
leto-client = { workspace = true }
leto-core = { workspace = true }
log = { workspace = true }
# The certificate browsers ask of a page before they let it decode video.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# Random codes and keys, and the fingerprints of keys. Already there for TLS.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Dates of the certificate, in the form its generator takes.
time = { version = "0.3", default-features = false }
# Many browsers at once, each sending and receiving at the same time.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
leto-testhost = { workspace = true }

