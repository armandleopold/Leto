[package]
name = "leto-testhost"
description = "A stand-in for a Sunshine or Apollo host, for tests and for trying the clients without a gaming PC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The stand-in is Leto's own host with a test card for a screen.
leto-host = { workspace = true }
# A moment of a microphone, for the tests that send one.
opus-rs = "0.1"
# Apollo's own pages, stood in for: its certificate, and its file of devices.
pem = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }

[dev-dependencies]
leto-core = { workspace = true }
# For the `serve` example: cover images, and the announcement on the network.
image = { workspace = true }
mdns-sd = "0.13"
