[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
# Code of others, built as it is: Leto's lints and tests are not for it.
exclude = ["vendor/moonlight-common", "vendor/cpal", "vendor/winit", "vendor/android-activity"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/armandleopold/leto"
homepage = "https://leto.re"
publish = false

[workspace.dependencies]
# Leto crates
leto-bridge = { path = "crates/leto-bridge" }
leto-client = { path = "crates/leto-client" }
leto-core = { path = "crates/leto-core" }
leto-host = { path = "crates/leto-host" }
leto-media = { path = "crates/leto-media" }
leto-protocol = { path = "crates/leto-protocol" }
leto-return = { path = "crates/leto-return" }
leto-system = { path = "crates/leto-system" }
leto-testhost = { path = "crates/leto-testhost" }
leto-tunnel = { path = "crates/leto-tunnel" }

# Third-party
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    # Copying out of the app's text fields.
    "clipboard",
    "default_fonts",
    "glow",
    # Opens web links in the system's browser.
    "links",
    "wayland",
    "x11",
] }
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
# The Moonlight protocol, client side. Not on crates.io: a copy of one commit,
# with the changes Leto needs (vendor/moonlight-common/README.md).
moonlight-common = { path = "vendor/moonlight-common", default-features = false, features = [
    "rustcrypto",
    "std",
] }
# H.264 in software, built from Cisco's source. Runs everywhere, no setup.
openh264 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
# FFI crates (codecs, OS capture APIs) opt back in with `#![allow(unsafe_code)]`.
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Keep debug builds of dependencies fast enough to use the app.
[profile.dev.package."*"]
opt-level = 2

# `leto-media` is Leto's own, and has loops that run once per pixel of every
# picture of a camera (`camera/pixels.rs`, `encode.rs`). Unoptimised, one
# picture of 640 by 360 takes 28 ms of the 33 ms a camera leaves between two:
# the camera stutters in a debug build, and on a busy computer most of its
# pictures come too late to be sent. Overflow checks stay on.
[profile.dev.package.leto-media]
opt-level = 2

# opus-decoder 0.1.1 keeps one bit per block of a frame in eight bits, and
# some frames of twenty milliseconds have sixteen blocks (`celt/vq.rs`,
# `extract_collapse_mask`). The shift that goes past the eighth bit wraps
# around in a release build, which gives what libopus computes; a debug
# build would stop there instead. `sudden_sounds_are_heard_too` in
# `leto-media` decodes such frames.
[profile.dev.package.opus-decoder]
overflow-checks = false

# android-activity, cpal and winit, each with a change for Android: see
# their LETO.md.
[patch.crates-io]
android-activity = { path = "vendor/android-activity" }
cpal = { path = "vendor/cpal" }
winit = { path = "vendor/winit" }
