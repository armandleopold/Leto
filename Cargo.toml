[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/armandleopold/leto"
homepage = "https://leto.re"
publish = false

[workspace.dependencies]
# Leto crates
leto-client = { path = "crates/leto-client" }
leto-core = { path = "crates/leto-core" }
leto-protocol = { path = "crates/leto-protocol" }
leto-testhost = { path = "crates/leto-testhost" }

# Third-party
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
# The Moonlight protocol, client side. Not on crates.io, so pinned to a commit.
moonlight-common = { git = "https://github.com/MrCreativ3001/moonlight-common-rust.git", rev = "5a3aa1f57bf70bb6a06c40bc435a18b2be44a252", default-features = false, features = [
    "rustcrypto",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
# FFI crates (codecs, OS capture APIs) opt back in with `#![allow(unsafe_code)]`.
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Keep debug builds of dependencies fast enough to use the app.
[profile.dev.package."*"]
opt-level = 2
